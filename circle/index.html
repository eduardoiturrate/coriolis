<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sine and cosine · Spin</title>
<meta name="description" content="Sine and cosine are the two shadows of a point going round a circle. Radians measure the angle by the arc. Adding two waves of the same speed is adding two turning arrows." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="../shared/topbar.css" />
<link rel="stylesheet" href="../shared/spin.css" />
</head>
<body>
<script src="../shared/spin.js"></script>
<script>
const { C, V, fmt, nums, TAU, DEG } = Spin;

const app = Spin.app({
  slug: 'circle',
  sub: 'A point goes round a circle of radius 1. The sine and the cosine are not new things: they are where the point is.',
  views: [{ caption: '' }, { caption: '' }],
  go: 'Restart', loop: false, speed: { min: 0.1, max: 2, value: 0.6, step: 0.05 },
});
const { ui, tr, pens } = app;
app.modes('mode', [['shadows', 'Shadows of a point'], ['radians', 'Angles and radians'], ['sum', 'Adding waves']]);
const is = (m) => (v) => v.mode === m;

ui.slider('th', { label: 'Angle', min: 0, max: 6.5, step: 0.01, value: 1, fmt: (v) => `${v.toFixed(2)} radians (${(v / DEG).toFixed(0)}°)`, show: is('radians') });
ui.chips([{ text: '1 radian', set: { th: 1 } }, { text: 'π/2', set: { th: Math.PI / 2 } }, { text: 'π', set: { th: Math.PI } }, { text: '2π', set: { th: TAU } }], { show: is('radians') });
ui.slider('A', { label: 'Size of the first arrow', min: 0, max: 2, step: 0.05, value: 1, fmt: (v) => v.toFixed(2), show: is('sum') });
ui.slider('B', { label: 'Size of the second arrow', min: 0, max: 2, step: 0.05, value: 1, fmt: (v) => v.toFixed(2), show: is('sum') });
ui.slider('dphi', { label: 'How far ahead the second arrow starts', min: 0, max: 360, step: 5, value: 90, fmt: (v) => `${v}°`, show: is('sum') });
ui.seg('k', [[1, 'Same speed'], [2, 'Twice as fast'], [3, 'Three times']], { label: 'Speed of the second arrow', show: is('sum') });
ui.hint('Drag the point on the circle with the mouse or a finger.', { show: is('shadows') });

let theta = 0.9;
const piFmt = (v) => (Math.abs(v) < 1e-9 ? '0' : `${+v.toFixed(2)}π`);
ui.on((id) => { if (id === 'mode') setup(); if (id !== 'th' && id !== 'A' && id !== 'B' && id !== 'dphi') tr.restart(); });
function setup() {
  const m = ui.v.mode;
  Spin.$('transport').hidden = m === 'radians';
  tr.go.hidden = m === 'radians';
  tr.pauseBtn.hidden = m === 'radians'; tr.speedBox.parentElement.hidden = m === 'radians';
  tr.setGo('Restart');
  const caps = { shadows: ['The unit circle', 'Unrolled: the height and the width of the point against the angle'], radians: ['The arc, measured in radiuses', 'For small angles, the sine and the angle are almost the same'], sum: ['Two arrows turning, head to tail', 'Heights against time, and their sum'] }[m];
  app.caption(0, caps[0]); app.caption(1, caps[1]);
  tr.reset(); tr.running = m !== 'radians';
}

// ---------- Shadows of a point ----------

function drawShadows(dt) {
  if (!tr.paused) theta = (theta + dt * 1.0) % TAU;
  const c = Math.cos(theta), s = Math.sin(theta), t = Math.tan(theta);
  const L = pens[0].begin().box(-1.7, 1.7, -2.5, 2.5, 12);
  L.circle({ x: 0, y: 0 }, 1, { fill: 'rgba(79,195,247,0.06)', stroke: 'rgba(255,255,255,0.55)', width: 2 });
  L.line([{ x: -1.6, y: 0 }, { x: 1.6, y: 0 }], 'rgba(255,255,255,0.3)', 1.5); L.line([{ x: 0, y: -2.3 }, { x: 0, y: 2.3 }], 'rgba(255,255,255,0.3)', 1.5);
  if (Math.abs(c) > 0.06 && Math.abs(t) < 2.3) { L.line([{ x: 1, y: -2.3 }, { x: 1, y: 2.3 }], 'rgba(155,231,166,0.25)', 1.2, [4, 4]); L.line([{ x: 0, y: 0 }, { x: Math.sign(c), y: Math.sign(c) * t }], 'rgba(155,231,166,0.45)', 1.2, [3, 4]); }
  const P = { x: c, y: s };
  const arc = []; for (let a = 0; a <= theta; a += 0.04) arc.push(V.polar(0.28, a)); arc.push(V.polar(0.28, theta));
  L.line(arc, C.spin, 2.5);
  L.line([{ x: 0, y: 0 }, P], '#fff', 2.5);
  L.line([{ x: 0, y: 0 }, { x: c, y: 0 }], C.ball, 5);       // the cosine: the shadow on the x axis
  L.line([{ x: c, y: 0 }, P], 'rgba(255,162,74,0.6)', 2.5);   // the same height, drawn up from there
  L.line([{ x: 0, y: 0 }, { x: 0, y: s }], C.ink, 5);        // the sine: the shadow on the y axis
  L.line([{ x: 0, y: s }, P], 'rgba(79,195,247,0.5)', 1.5, [3, 4]);
  if (Math.abs(c) > 0.06 && Math.abs(t) < 2.3 && c > 0) { L.dot({ x: 1, y: t }, C.you, 5); L.line([{ x: 1, y: 0 }, { x: 1, y: t }], C.you, 3); }
  L.dot(P, '#fff', 7);
  L.text('cos', { x: c / 2, y: 0 }, { dy: s >= 0 ? 14 : -14, size: 11.5, color: C.ball }); L.text('sin', { x: 0, y: s / 2 }, { dx: c >= 0 ? -18 : 18, size: 11.5, color: C.ink });
  L.text('θ', V.polar(0.42, theta / 2), { size: 12, color: C.spin });
  L.note('The two shadows of the point are its cosine (blue) and its sine (orange)');

  const R = pens[1].begin();
  const hh = R.ch / 2 - 6, xs = theta / Math.PI;
  const mk = (title, f, col, y) => {
    const ch = R.chart({ x: 4, y, w: R.cw - 8, h: hh }, { x0: 0, x1: 2, y0: -1.2, y1: 1.2, title, xTicks: 4, yTicks: 4, fmtX: piFmt, fmtY: (v) => v.toFixed(1), padB: 22 });
    const pts = []; for (let a = 0; a <= 2 + 1e-9; a += 0.01) pts.push({ x: a, y: f(a * Math.PI) });
    ch.hline(0, 'rgba(255,255,255,0.35)', [1, 0]);
    ch.line(pts.filter((q) => q.x <= xs), col, 3); ch.line(pts, `${col.replace(')', ',0.25)').replace('rgb', 'rgba')}`, 1.5);
    ch.vline(xs); ch.dot(xs, f(theta), col, 6);
  };
  mk('Sine against the angle', Math.sin, 'rgb(255,162,74)', 2);
  mk('Cosine against the angle', Math.cos, 'rgb(79,195,247)', hh + 8);

  app.explain(`${nums([['angle', `${theta.toFixed(2)}`, `radians (${(theta / DEG).toFixed(0)}°)`], ['cos θ', c.toFixed(3)], ['sin θ', s.toFixed(3)], ['cos² + sin²', (c * c + s * s).toFixed(3)]])}
    <p>Put a point on a circle of radius 1, and let it go round. Its position is two numbers: how far across, and how far up. <b>Those two numbers are the cosine and the sine of the angle.</b> That is all they are. Draw the width of the point against the angle and you get the cosine wave. Draw its height and you get the sine wave. One turn is one full wave, and it repeats forever, because the point just keeps going round.</p>
    <p>The famous rule sin² + cos² = 1 is Pythagoras: the point is at distance 1 from the middle. The tangent (green) is the height where the line through the point cuts the vertical line at the edge. It grows without limit as the point nears the top, where the line becomes vertical.</p>`);
}
pens[0].pointer({
  down(w) { tr.paused = true; tr.setPause('Go on'); theta = (Math.atan2(w.y, w.x) + TAU) % TAU; },
  move(w) { theta = (Math.atan2(w.y, w.x) + TAU) % TAU; },
});

// ---------- Angles and radians ----------

function drawRadians() {
  const th = ui.v.th;
  const L = pens[0].begin().box(-1.6, 1.6, -1.6, 1.6, 12);
  L.circle({ x: 0, y: 0 }, 1, { stroke: 'rgba(255,255,255,0.45)', width: 2 });
  L.line([{ x: 0, y: 0 }, { x: 1.4, y: 0 }], 'rgba(255,255,255,0.3)', 1.5);
  // The arc of length th, with a mark for every radius length.
  const arc = []; for (let a = 0; a <= th; a += 0.02) arc.push(V.polar(1, a)); arc.push(V.polar(1, th));
  L.line(arc, C.spin, 5);
  for (let k = 1; k <= 6; k++) {
    const a = k, p = V.polar(1, a);
    L.line([V.mul(p, 0.93), V.mul(p, 1.07)], k <= th ? C.ink : 'rgba(255,255,255,0.35)', 2);
    L.text(String(k), V.mul(p, 1.18), { size: 11, color: k <= th ? C.ink : 'rgba(255,255,255,0.45)' });
  }
  L.line([{ x: 0, y: 0 }, V.polar(1, th)], '#fff', 2.5);
  L.dot(V.polar(1, th), '#fff', 6);
  L.line([{ x: 0, y: 0 }, { x: 1, y: 0 }], C.you, 3.5); L.text('radius = 1', { x: 0.5, y: 0 }, { dy: 14, size: 11, color: C.you });
  L.note('The angle is the length of the arc, measured in radiuses');

  const R = pens[1].begin();
  const x1 = 1.6;
  const ch = R.chart({ x: 4, y: 2, w: R.cw - 8, h: R.ch - 6 }, { x0: 0, x1, y0: 0, y1: 2.2, title: 'The angle θ (white), sin θ (orange) and tan θ (green), for small angles', xTicks: 8, yTicks: 5, fmtX: (v) => v.toFixed(1), fmtY: (v) => v.toFixed(1), xTitle: 'angle θ in radians' });
  const idl = [{ x: 0, y: 0 }, { x: x1, y: x1 }], sn = [], tn = [];
  for (let a = 0; a <= x1 + 1e-9; a += 0.01) { sn.push({ x: a, y: Math.sin(a) }); if (Math.tan(a) <= 2.2 && Math.tan(a) >= 0) tn.push({ x: a, y: Math.tan(a) }); }
  ch.line(idl, 'rgba(255,255,255,0.7)', 2, [5, 4]); ch.line(sn, C.ink, 3); ch.line(tn, C.you, 3);
  if (th <= x1) { ch.vline(th); ch.dot(th, Math.sin(th), C.ink, 6); if (Math.tan(th) <= 2.2) ch.dot(th, Math.tan(th), C.you, 6); }

  const err = th > 0 ? ((th - Math.sin(th)) / th) * 100 : 0;
  app.explain(`${nums([['angle', `${th.toFixed(3)}`, 'radiuses of arc'], ['in degrees', `${(th / DEG).toFixed(1)}°`], ['sin θ', Math.sin(th).toFixed(4)], ['sin θ is less than θ by', `${err.toFixed(2)}%`]])}
    <p>A <b>radian</b> is the angle you get when the arc is as long as the radius. Lay the radius along the circle (the orange marks) and it fits 6 times and a bit more: 2π = 6.283… radiuses all the way around. That is why π shows up in every circle formula, and why a full turn is 2π. Degrees (360 in a turn) are only a convention. Radians are what the angle really is: a length divided by a length.</p>
    <p>This is why radians make the formulas simple. The arc of angle θ on a circle of radius r is just rθ. And for a small angle, the arc, the height of the point (sin θ) and the tan θ are almost the same, so sin θ ≈ θ (try θ = 0.1: the error is 0.17%). In degrees that is false, and the formulas get a messy factor of π/180.</p>`);
}

// ---------- Adding waves ----------

function drawSum() {
  const { A, B, dphi, k } = ui.v;
  const t = tr.t * 1.4, ph = dphi * DEG;
  const a1 = V.polar(A, t), a2 = V.polar(B, k * t + ph), tot = V.add(a1, a2);
  const ext = A + B + 0.2;
  const L = pens[0].begin().box(-ext, ext, -ext, ext, 14);
  L.circle({ x: 0, y: 0 }, A, { stroke: 'rgba(255,162,74,0.25)', width: 1, dash: [3, 4] });
  L.circle(a1, B, { stroke: 'rgba(79,195,247,0.25)', width: 1, dash: [3, 4] });
  const trace = []; for (let s = t - TAU / Math.min(k, 1) * 1; s <= t + 1e-9; s += 0.04) trace.push(V.add(V.polar(A, s), V.polar(B, k * s + ph)));
  L.line(trace, 'rgba(255,255,255,0.3)', 1.6);
  L.arrow({ x: 0, y: 0 }, a1, C.ink, 3.5, ''); L.arrow(a1, a2, C.ball, 3.5, '');
  L.arrow({ x: 0, y: 0 }, tot, '#fff', 4, 'sum');
  L.line([{ x: -ext, y: 0 }, { x: ext, y: 0 }], 'rgba(255,255,255,0.2)', 1);
  L.line([{ x: tot.x, y: 0 }, tot], 'rgba(255,255,255,0.4)', 1.2, [3, 4]);
  L.note('Each arrow turns. The sum is the third arrow. Its height is the sum of the heights.');

  const R = pens[1].begin();
  const win = 4 * Math.PI, t0 = t - win * 0.7;
  const ymax = A + B + 0.2;
  const ch = R.chart({ x: 4, y: 2, w: R.cw - 8, h: R.ch - 6 }, { x0: t0, x1: t0 + win, y0: -ymax, y1: ymax, title: 'Height of the first arrow (orange), the second (blue), and the sum (white), against time', xTicks: 6, yTicks: 4, fmtX: () => '', fmtY: (v) => v.toFixed(1), padB: 10 });
  const f1 = [], f2 = [], f3 = [];
  for (let s = t0; s <= t0 + win + 1e-9; s += 0.04) { const x = A * Math.sin(s), y = B * Math.sin(k * s + ph); f1.push({ x: s, y: x }); f2.push({ x: s, y: y }); f3.push({ x: s, y: x + y }); }
  ch.hline(0, 'rgba(255,255,255,0.3)', [1, 0]);
  ch.line(f1, 'rgba(255,162,74,0.7)', 1.8); ch.line(f2, 'rgba(79,195,247,0.7)', 1.8); ch.line(f3, '#fff', 3.2);
  ch.vline(t, 'rgba(255,255,255,0.35)');
  const Rr = Math.sqrt(A * A + B * B + 2 * A * B * Math.cos(ph));
  const pure = k === 1;
  app.explain(`${pure ? nums([['size of the sum', Rr.toFixed(2)], ['it is a sine wave', 'yes'], ['starts ahead by', `${(Math.atan2(B * Math.sin(ph), A + B * Math.cos(ph)) / DEG).toFixed(0)}°`]]) : nums([['it is a sine wave', 'no'], ['it repeats after', '1 turn']])}
    <p>A wave A sin(t) is the height of an arrow that turns. Adding two such waves means adding their heights, and adding two arrows (head to tail) gives an arrow whose height is exactly that sum: the height of a sum is the sum of the heights. ${pure ? 'When both arrows turn at the <b>same speed</b>, they keep the same angle between them, so the sum is one arrow of fixed length that turns at that same speed. So the sum is again a pure sine wave. Its size is found from the triangle: R² = A² + B² + 2AB cos(Δ), where Δ is how far ahead the second arrow starts. Set Δ to 0° and the sizes add. Set it to 180° and they cancel.' : 'When the second arrow turns <b>faster</b>, the angle between the two keeps changing, the sum arrow changes its length as it goes, and the sum is no longer a sine wave. The white path on the left is the tip of the sum. This is how Fourier circles build any shape.'}</p>
    <p>This is the idea behind the phase lag on the Resonance page, and the beats on the Coupled oscillators page: adding waves is adding arrows.</p>`);
}

let lastT = performance.now();
Spin.run((now) => {
  tr.step(now);
  const dt = Math.min(0.1, (now - lastT) / 1000) * tr.speed; lastT = now;
  const m = ui.v.mode;
  if (m === 'shadows') drawShadows(tr.running ? dt : 0); else if (m === 'radians') drawRadians(); else drawSum();
});
setup();
</script>
</body>
</html>
