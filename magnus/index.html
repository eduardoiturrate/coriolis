<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spinning balls · Spin</title>
<meta name="description" content="Why a spinning ball curves: the Magnus force, which points along the turning axis crossed with the velocity. Top-spin, back-spin and side-spin for a free kick, a curveball, a tennis lob and a golf drive." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="../shared/topbar.css" />
<link rel="stylesheet" href="../shared/spin.css" />
</head>
<body>
<script src="../shared/spin.js"></script>
<script>
const { C, V3, fmt, nums, TAU, DEG } = Spin;
const G = 9.81, RHO = 1.2;

const app = Spin.app({
  slug: 'magnus',
  sub: 'A spinning ball drags a thin layer of air round with it, and is pushed sideways. The push follows the cross product.',
  views: [{ caption: 'The flight (drag to turn the view)' }, { caption: 'The same flight as two graphs' }],
  go: 'Kick', speed: { min: 0.1, max: 2, value: 0.8, step: 0.05 },
});
const { ui, tr, pens } = app;

const BALLS = { soccer: { name: 'Football', m: 0.43, r: 0.11, cd: 0.25, z0: 0.3 }, base: { name: 'Baseball', m: 0.145, r: 0.0366, cd: 0.35, z0: 1.8 }, tennis: { name: 'Tennis ball', m: 0.057, r: 0.033, cd: 0.55, z0: 1.0 }, golf: { name: 'Golf ball', m: 0.0459, r: 0.0213, cd: 0.25, z0: 0.05 } };
ui.seg('ball', Object.entries(BALLS).map(([k, b]) => [k, b.name]), { label: 'Ball' });
ui.slider('v', { label: 'Speed off the foot, bat or club', min: 10, max: 80, step: 1, value: 28, fmt: (v) => `${v} m/s (${(v * 3.6).toFixed(0)} km/h)` });
ui.slider('el', { label: 'Angle upward', min: 0, max: 45, step: 1, value: 14, fmt: (v) => `${v}°` });
ui.slider('rps', { label: 'Spin', min: 0, max: 60, step: 1, value: 9, fmt: (v) => `${v} turns a second` });
ui.seg('type', [['back', 'Backspin'], ['top', 'Topspin'], ['left', 'Side: curves left'], ['right', 'Side: curves right']], { label: 'Which way it spins', pick: true, cols: 2, value: 'left' });
ui.slider('wind', { label: 'Wind', min: 0, max: 20, step: 1, value: 0, fmt: (v) => (v === 0 ? 'none' : `${v} m/s (${(v * 3.6).toFixed(0)} km/h)`) });
ui.seg('wdir', [['tail', 'From behind'], ['head', 'Into your face'], ['L', 'From the left'], ['R', 'From the right']], { label: 'The wind comes', pick: true, cols: 2, value: 'R', show: (v) => v.wind > 0 });
ui.chips([
  { text: 'Free kick', set: { ball: 'soccer', v: 28, el: 14, rps: 9, type: 'left', wind: 0 } },
  { text: 'Curveball', set: { ball: 'base', v: 38, el: 4, rps: 30, type: 'top', wind: 0 } },
  { text: 'Tennis topspin', set: { ball: 'tennis', v: 30, el: 12, rps: 25, type: 'top', wind: 0 } },
  { text: 'Golf drive', set: { ball: 'golf', v: 65, el: 12, rps: 45, type: 'back', wind: 0 } },
  { text: 'Free kick, crosswind', set: { ball: 'soccer', v: 28, el: 14, rps: 9, type: 'left', wind: 10, wdir: 'R' } },
  { text: 'Golf drive, headwind', set: { ball: 'golf', v: 65, el: 12, rps: 45, type: 'back', wind: 10, wdir: 'head' } },
]);
ui.check('ghost', 'Show the same shot with no spin (in the same wind)', true);
ui.check('air', 'Show the air flowing past the ball (close-up)', true);

const cam = new Spin.Cam3(pens[0], { az: 0.55, el: 0.3, dist: 60, fov: 34, min: 2, max: 300 });
const AXES = { back: { x: 0, y: -1, z: 0 }, top: { x: 0, y: 1, z: 0 }, left: { x: 0, y: 0, z: 1 }, right: { x: 0, y: 0, z: -1 } };
/** The way the air moves over the ground. 'From the right' blows toward the left (+y). */
const windVec = () => { const { wind, wdir } = ui.v; return { x: wdir === 'tail' ? wind : wdir === 'head' ? -wind : 0, y: wdir === 'R' ? wind : wdir === 'L' ? -wind : 0, z: 0 }; };
const WIND_WORDS = { tail: 'from behind', head: 'into your face', L: 'from the left', R: 'from the right' };

/** Streamlines of the air past the ball, seen from the ball (the ball is at the origin with radius 1). They are drawn from a
 *  simple model of the flow round a round body, not computed: the flow is bent behind the ball, away from the push. */
function airflow(cur) {
  const vr = cur.vr, sp = V3.len(vr);
  if (sp < 1e-6) return;
  const d = V3.mul(vr, -1 / sp);                                    // the way the air flows, seen from the ball
  let pu = V3.len(cur.F) > 1e-6 ? V3.norm(cur.F) : V3.cross({ x: 0, y: 0, z: 1 }, d);
  pu = V3.norm(V3.add(pu, V3.mul(d, -V3.dot(pu, d))));
  const S = cur.S, CL = (2 * S) / (1 + 3.5 * S), spinning = ui.v.rps > 0, bend = spinning ? Math.min(1.1, 3.5 * CL) : 0;
  const colr = 'rgba(120,205,255,0.6)';
  const blocked = (q) => {                                            // is the point hidden behind the ball?
    const c = cam.pos, w = V3.add(q, V3.mul(c, -1)), len = V3.len(w), u = V3.mul(w, 1 / len), tp = -V3.dot(c, u);
    return tp > 0 && tp < len && V3.len(V3.add(c, V3.mul(u, tp))) < 1;
  };
  [-1.7, -1.2, -0.8, 0.8, 1.2, 1.7].forEach((psi, n) => {
    const line = []; let y = psi;
    for (let x = -2.4; x <= 2.4; x += 0.06) {
      for (let it = 0; it < 6; it++) { const r2 = x * x + y * y; y -= (y * (r2 - 1) - psi * r2) / (x * x + 3 * y * y - 1 - 2 * psi * y); }
      const sm = Math.min(1, Math.max(0, (x - 0.5) / 2.2)), w = sm * sm * (3 - 2 * sm);
      line.push(V3.add(V3.mul(d, x), V3.mul(pu, y - bend * w)));
    }
    let run = [];
    const flush = () => { if (run.length > 1) cam.line(run, colr, 1.6); run = []; };
    for (const q of line) { if (blocked(q)) flush(); else run.push(q); }
    flush();
    cam.arrow(line[6], V3.add(line[12], V3.mul(line[6], -1)), colr, 1.6, n === 5 ? 'air' : undefined);
  });
  if (spinning) {
    cam.text('with the air', V3.mul(pu, 1.85), { size: 9, color: 'rgba(170,220,255,0.95)' });
    cam.text('against the air', V3.mul(pu, -1.85), { size: 9, color: 'rgba(170,220,255,0.7)' });
  }
}

// The ball close up, in a corner of the 3D view. It uses the same viewing direction as the flight.
// The turning is slowed down so that the eye can follow it: a real ball turns 9 to 60 times a second.
let spinPhase = 0, lastNow = performance.now();
function closeUp(cur, dtReal) {
  const pen = pens[0], ctx = pen.ctx, { type, rps } = ui.v;
  const a = AXES[type];
  const visRps = rps > 0 ? 0.3 + 1.2 * (rps / 60) : 0;
  if (!tr.paused) spinPhase += TAU * visRps * dtReal * tr.speed;
  const size = Math.min(176, 0.38 * Math.min(pen.cw, pen.ch)), x0 = 10, y0 = 34;
  const cx = (x0 + size / 2) * pen.dpr, cy = (y0 + size / 2) * pen.dpr, rpx = 0.2 * size * pen.dpr;
  const keep = { dist: cam.dist, target: cam.target };
  cam.target = { x: 0, y: 0, z: 0 };
  cam.dist = (0.5 * Math.min(pen.w, pen.h) / Math.tan(cam.fov / 2)) / rpx;
  cam.begin();
  ctx.save();
  ctx.fillStyle = 'rgba(5,8,15,0.9)'; ctx.fillRect(x0 * pen.dpr, y0 * pen.dpr, size * pen.dpr, size * pen.dpr);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = pen.px(1); ctx.strokeRect(x0 * pen.dpr, y0 * pen.dpr, size * pen.dpr, size * pen.dpr);
  ctx.beginPath(); ctx.rect(x0 * pen.dpr, y0 * pen.dpr, size * pen.dpr, size * pen.dpr); ctx.clip();
  ctx.translate(cx - pen.w / 2, cy - pen.h / 2);
  // the ball: a shaded disc, with seams that turn about the spin axis
  const lx = pen.w / 2, ly = pen.h / 2;
  const g = ctx.createRadialGradient(lx - 0.35 * rpx, ly - 0.35 * rpx, 0.1 * rpx, lx, ly, rpx);
  g.addColorStop(0, '#f1f4f9'); g.addColorStop(1, '#6f7f93');
  cam.line([V3.mul(a, -1.5), V3.mul(a, 1.5)], 'rgba(255,213,79,0.45)', 1.3, [3, 4]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, rpx, 0, TAU); ctx.fill();
  const e1 = V3.norm(V3.cross(a, Math.abs(a.z) < 0.9 ? { x: 0, y: 0, z: 1 } : { x: 1, y: 0, z: 0 })), e2 = V3.cross(a, e1);
  const on = (lam, phi) => { const c = Math.cos(phi), s = Math.sin(phi); return V3.add(V3.mul(V3.add(V3.mul(e1, Math.cos(lam)), V3.mul(e2, Math.sin(lam))), c), V3.mul(a, s)); };
  const runs = (pts, color, w) => {                                 // only the part of the line on the near side
    let run = [];
    const flush = () => { if (run.length > 1) cam.line(run, color, w); run = []; };
    for (const p of pts) { if (V3.dot(p, cam.pos) > 1) run.push(p); else flush(); }
    flush();
  };
  for (const phi of [-0.9, -0.45, 0, 0.45, 0.9]) { const ring = []; for (let k = 0; k <= 48; k++) ring.push(on((k / 48) * TAU, phi)); runs(ring, 'rgba(25,35,52,0.35)', 1); }
  for (let m = 0; m < 6; m++) {
    const lam = spinPhase + (m * TAU) / 6, line = [];
    for (let k = -24; k <= 24; k++) line.push(on(lam, (k / 24) * (Math.PI / 2)));
    runs(line, 'rgba(25,35,52,0.55)', 1.3);
  }
  if (ui.v.air) airflow(cur);
  if (rps > 0) {
    // a curved arrow around the ball, in the sense of the turning, going round with it
    const arc = [], span = 1.9;
    for (let k = 0; k <= 30; k++) { const lam = spinPhase + 0.3 + (k / 30) * span; arc.push(V3.mul(on(lam, 0), 1.25)); }
    cam.line(arc, 'rgba(255,213,79,0.6)', 4);
    const tip = arc[arc.length - 1], before = arc[arc.length - 3];
    cam.arrow(before, V3.add(tip, V3.mul(before, -1)), 'rgba(255,213,79,0.6)', 4);
  }
  if (rps > 0) cam.arrow(V3.mul(a, 1.0), V3.mul(a, 0.55), C.spin, 3, 'spin');
  cam.arrow({ x: 0, y: 0, z: 0 }, V3.mul(V3.norm(cur.v), 1.45), C.ball, 2.6, 'velocity');
  if (V3.len(cur.F) > 1e-6) cam.arrow({ x: 0, y: 0, z: 0 }, V3.mul(V3.norm(cur.F), 1.45), C.you, 2.6, 'push');
  ctx.restore();
  cam.dist = keep.dist; cam.target = keep.target;
  pen.textS('The ball, close up', x0 + size / 2, y0 + size + 9, { size: 10.5, color: 'rgba(255,255,255,0.75)' });
  pen.textS(rps > 0 ? 'turning slowed down' : 'not spinning', x0 + size / 2, y0 + size + 22, { size: 10, color: 'rgba(255,255,255,0.5)', weight: 500 });
}
ui.on((id) => { sim = null; tr.restart(); });

let sim = null;
/** One flight: x forward, y to the left, z up. The spin vector for each kind of spin points along an axis. */
function flight(spinRps) {
  const { ball, v, el, type } = ui.v, b = BALLS[ball];
  const w = spinRps * TAU, A = Math.PI * b.r * b.r;
  const axis = { back: { x: 0, y: -1, z: 0 }, top: { x: 0, y: 1, z: 0 }, left: { x: 0, y: 0, z: 1 }, right: { x: 0, y: 0, z: -1 } }[type];
  const wv = windVec();
  const what = (s) => {
    const vv = { x: s[3] - wv.x, y: s[4] - wv.y, z: s[5] - wv.z };   // the velocity against the air
    const sp = V3.len(vv);
    const S = (b.r * w) / Math.max(sp, 1e-6), CL = (2 * S) / (1 + 3.5 * S);
    const mag = V3.cross(axis, vv); // omega-hat cross v
    const km = (0.5 * RHO * A * CL) / b.m, kd = (0.5 * RHO * A * b.cd) / b.m;
    return { a: [km * sp * mag.x - kd * sp * vv.x, km * sp * mag.y - kd * sp * vv.y, km * sp * mag.z - kd * sp * vv.z - G], S, CL, F: V3.mul(mag, km * sp * b.m), vr: vv };
  };
  let s = [0, 0, b.z0, v * Math.cos(el * DEG), 0, v * Math.sin(el * DEG)], t = 0;
  const pts = [{ t, p: { x: s[0], y: s[1], z: s[2] }, v: { x: s[3], y: s[4], z: s[5] }, F: what(s).F, S: what(s).S, vr: what(s).vr }];
  const f = (q) => { const o = what(q).a; return [q[3], q[4], q[5], o[0], o[1], o[2]]; };
  while (t < 14) {
    s = Spin.rk4(f, s, 0, 0.004); t += 0.004;
    if (Math.round(t / 0.004) % 5 === 0) pts.push({ t, p: { x: s[0], y: s[1], z: s[2] }, v: { x: s[3], y: s[4], z: s[5] }, F: what(s).F, S: what(s).S, vr: what(s).vr });
    if (s[2] <= 0 && t > 0.02) break;
  }
  return pts;
}
function solve() {
  const spin = flight(ui.v.rps), none = flight(0);
  const last = spin[spin.length - 1].p, lastN = none[none.length - 1].p;
  const range = Math.max(last.x, lastN.x, 5);
  cam.dist = Math.max(8, range * 1.9); cam.target = { x: range / 2, y: 0, z: range * 0.06 };
  sim = { spin, none, range, key: JSON.stringify(ui.v), hmax: Math.max(...spin.map((q) => q.p.z)), hmaxN: Math.max(...none.map((q) => q.p.z)) };
}

function draw(now) {
  tr.step(now);
  if (!sim || sim.key !== JSON.stringify(ui.v)) solve();
  const s = sim, T = s.spin[s.spin.length - 1].t;
  const t = Math.min(tr.t * 2, T);
  if (tr.running && tr.t * 2 > T + 1.2) tr.finish();
  const cur = (() => { let i = 0; while (i < s.spin.length - 1 && s.spin[i].t < t) i++; return s.spin[i]; })();
  const upto = s.spin.filter((q) => q.t <= t);
  const R = s.range;

  pens[0].begin(); cam.begin();
  for (let x = 0; x <= R + 1; x += Math.max(5, Math.round(R / 8 / 5) * 5)) cam.line([{ x, y: -R * 0.35, z: 0 }, { x, y: R * 0.35, z: 0 }], 'rgba(155,231,166,0.18)', 1);
  cam.line([{ x: 0, y: 0, z: 0 }, { x: R * 1.05, y: 0, z: 0 }], 'rgba(155,231,166,0.4)', 1.5);
  for (let y = -R * 0.3; y <= R * 0.31; y += R * 0.15) cam.line([{ x: 0, y, z: 0 }, { x: R * 1.05, y, z: 0 }], 'rgba(155,231,166,0.1)', 1);
  if (ui.v.ghost) cam.line(s.none.map((q) => q.p), 'rgba(255,255,255,0.35)', 1.8, [5, 5]);
  cam.line(upto.map((q) => q.p), C.ink, 3);
  const ball = cur.p, k = R * 0.09;
  const axis = { back: { x: 0, y: -1, z: 0 }, top: { x: 0, y: 1, z: 0 }, left: { x: 0, y: 0, z: 1 }, right: { x: 0, y: 0, z: -1 } }[ui.v.type];
  if (ui.v.wind > 0) {
    const wv = windVec(), half = V3.mul(wv, (R * 0.015) / 2), mid = { x: R * 0.5, y: -R * 0.28, z: 0 };
    cam.arrow(V3.add(mid, V3.mul(half, -1)), V3.mul(half, 2), '#7fd6ff', 3.4, `wind ${ui.v.wind} m/s`);
  }
  cam.dot(ball, '#fff', 7);
  if (ui.v.rps > 0) cam.arrow(ball, V3.mul(axis, k * 0.8), C.spin, 3.2, 'spin axis');
  cam.arrow(ball, V3.mul(V3.norm(cur.v), k * 1.3), C.ball, 3, 'velocity');
  const Fm = V3.len(cur.F);
  if (Fm > 1e-6) cam.arrow(ball, V3.mul(V3.norm(cur.F), k * 1.1), C.you, 3.4, 'Magnus push');
  pens[0].note(`Range ${upto[upto.length - 1].p.x.toFixed(0)} m`);
  const dtReal = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  closeUp(cur, dtReal);

  const q = pens[1].begin();
  const h = q.ch / 2 - 6;
  const ymax = Math.max(1, ...s.spin.map((p) => Math.abs(p.p.y)), ...s.none.map((p) => Math.abs(p.p.y))) * 1.15;
  const c1 = q.chart({ x: 4, y: 2, w: q.cw - 8, h }, { x0: 0, x1: R * 1.05, y0: -ymax, y1: ymax, title: 'Sideways drift, left (+) and right (−) (m), against distance (m)', xTicks: 6, yTicks: 4, fmtX: (v) => v.toFixed(0), fmtY: (v) => v.toFixed(1), padB: 22 });
  c1.hline(0, 'rgba(255,255,255,0.35)', [1, 0]);
  if (ui.v.ghost) c1.line(s.none.map((p) => ({ x: p.p.x, y: p.p.y })), 'rgba(255,255,255,0.4)', 1.6, [4, 4]);
  c1.line(s.spin.filter((p) => p.t <= t).map((p) => ({ x: p.p.x, y: p.p.y })), C.ink, 3);
  c1.dot(cur.p.x, cur.p.y, '#fff', 5);
  const zmax = Math.max(s.hmax, s.hmaxN, 1) * 1.15;
  const c2 = q.chart({ x: 4, y: h + 8, w: q.cw - 8, h }, { x0: 0, x1: R * 1.05, y0: 0, y1: zmax, title: 'Height (m), against distance (m)', xTicks: 6, yTicks: 4, fmtX: (v) => v.toFixed(0), fmtY: (v) => v.toFixed(1), padB: 22 });
  if (ui.v.ghost) c2.line(s.none.map((p) => ({ x: p.p.x, y: p.p.z })), 'rgba(255,255,255,0.4)', 1.6, [4, 4]);
  c2.line(s.spin.filter((p) => p.t <= t).map((p) => ({ x: p.p.x, y: p.p.z })), C.ink, 3);
  c2.dot(cur.p.x, cur.p.z, '#fff', 5);

  const L = s.spin[s.spin.length - 1], N = s.none[s.none.length - 1];
  const S0 = s.spin[0].S;
  const verb = { back: 'Backspin makes the ball rise and stay up longer: it goes farther.', top: 'Topspin pushes the ball down: it dips quickly.', left: 'Side-spin pushes the ball to the left.', right: 'Side-spin pushes the ball to the right.' }[ui.v.type];
  app.explain(`${nums([['lands at', `${L.p.x.toFixed(1)} m`, `(${(L.p.x - N.p.x >= 0 ? '+' : '')}${(L.p.x - N.p.x).toFixed(1)} m against no spin)`], ['sideways', `${Math.abs(L.p.y).toFixed(1)} m`, L.p.y > 0.05 ? 'left' : L.p.y < -0.05 ? 'right' : ''], ['highest', `${s.hmax.toFixed(1)} m`, `(${s.hmaxN.toFixed(1)} m with no spin)`], ['spin ratio rω/v', S0.toFixed(2)], ['wind', ui.v.wind > 0 ? `${ui.v.wind} m/s` : 'none', ui.v.wind > 0 ? WIND_WORDS[ui.v.wdir] : '']])}
    <p>A spinning ball drags the air next to it round with it. On one side, the ball moves with the air that goes past it, and on the other it moves against it. The air is left curving round the ball, and the ball gets an equal push the other way. The push, the <b>Magnus force</b>, points along <b>spin axis × velocity</b> (the cross product): at right angles to both. Use the right-hand rule: curl the fingers of your right hand from the spin axis toward the velocity, and the thumb points along the push. ${verb}</p>
    <p>It is a small force next to the weight of the ball. But it acts all through the flight, so it bends the path far more than it seems it could: a free kick curves a few meters, a good curveball drops about half a meter more than gravity alone. The golf ball's backspin gives it lift, so a drive stays up for 6 seconds. The dashed path is the same shot with no spin, for comparison. The drag from the air is included for both.</p>
    <p>This is not the Coriolis effect. The Magnus force is a real force from the air, and it needs the ball to spin. The Coriolis effect is a pretend force of a turning frame such as the Earth, and it acts on any moving ball, spinning or not. Both are written with a cross product, which is why they look alike. For a free kick, Coriolis bends the path by about 3 mm. The Magnus force bends it by metres.</p>${ui.v.wind > 0 ? `
    <p><b>Wind.</b> The wind moves the air, not the ball. What the ball feels is its velocity <b>against the air</b>, and both the drag and the Magnus force depend on it. A wind into your face raises the speed through the air: more drag, so the ball loses speed and range, and more lift for backspin. A wind from behind does the reverse. A crosswind pushes the ball sideways through the drag, and the curve from the spin adds to it or works against it. The dashed path is flown in the same wind.</p>` : ''}`);
}
tr.restart();
Spin.run(draw);
</script>
</body>
</html>
