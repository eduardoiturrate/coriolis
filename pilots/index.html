<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pilots and spinning stations · Spin</title>
<meta name="description" content="How g-force drains the blood from the head in a fighter pilot or a centrifuge, why a reclined seat and a g-suit help, and how large and how slow a spinning space station must be to feel comfortable." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="../shared/topbar.css" />
<link rel="stylesheet" href="../shared/spin.css" />
</head>
<body>
<script src="../shared/spin.js"></script>
<script>
const { C, V, nums, TAU, DEG, clamp } = Spin;
const G0 = 9.81;

const app = Spin.app({
  slug: 'pilots',
  sub: 'Turning fast makes a strong force, and a tall body feels it unevenly. What a pilot can take, and what a space station can ask of people.',
  views: [{ caption: '' }, { caption: '' }],
  go: 'Restart', speed: { min: 0.1, max: 2, value: 1, step: 0.05 }, autostart: true,
});
const { ui, tr, pens } = app;
app.modes('mode', [['gforce', 'Blood and g-force'], ['station', 'A spinning station']]);
const is = (m) => (v) => v.mode === m;

// Blood and g-force
ui.slider('gz', { label: 'Force on the pilot, head to feet', min: 1, max: 12, step: 0.1, value: 4, fmt: (v) => `${v.toFixed(1)} g`, show: is('gforce') });
ui.slider('R', { label: 'Length of the arm', min: 2, max: 10, step: 0.5, value: 8, fmt: (v) => `${v} m`, show: is('gforce') });
ui.slider('tilt', { label: 'How far the seat is tilted back', min: 0, max: 70, step: 1, value: 0, fmt: (v) => (v === 0 ? 'upright' : `${v}°`), show: is('gforce') });
ui.check('suit', 'G-suit and straining the muscles', false, { show: is('gforce') });
ui.chips([{ text: 'Upright, no help', set: { tilt: 0, suit: false } }, { text: 'Seat tilted back 30° (as in an F-16)', set: { tilt: 30, suit: false } }, { text: 'G-suit and straining', set: { tilt: 30, suit: true } }], { show: is('gforce') });
// A spinning station
ui.slider('Rs', { label: 'Radius of the station', min: 5, max: 500, log: true, value: 100, fmt: (v) => `${v} m`, show: is('station') });
ui.slider('gs', { label: 'Weight you want at the floor', min: 0.1, max: 1.5, step: 0.05, value: 1, fmt: (v) => `${v.toFixed(2)} g`, show: is('station') });
ui.chips([{ text: 'Small: 20 m, 1 g', set: { Rs: 20, gs: 1 } }, { text: 'Large: 224 m, 1 g', set: { Rs: 224, gs: 1 } }, { text: 'Mars weight, 100 m', set: { Rs: 100, gs: 0.38 } }, { text: 'A kilometre wide', set: { Rs: 500, gs: 1 } }], { show: is('station') });
ui.on((id) => { if (id === 'mode') setup(); });
function setup() {
  const m = ui.v.mode;
  app.caption(0, m === 'gforce' ? 'A human centrifuge, seen from above' : 'A spinning station, seen from its axis');
  app.caption(1, m === 'gforce' ? 'Blood pressure at the eyes, against g' : 'How fast the station turns, against its radius');
}

// ---------- Blood and g-force ----------
const RHO = 1060, HEYE = 0.30;                                  // blood density; distance from the heart to the eyes, sitting
const pHeart = (g, suit) => 13.3 + 0.8 * (g - 1) + (suit ? 8.6 : 0);                    // kPa: the normal 100 mmHg, the body's own reaction, and the suit with straining
const pEye = (g, tilt, suit) => pHeart(g, suit) - (RHO * G0 * HEYE * g * Math.cos(tilt * DEG)) / 1000;
function vision(P) { return P >= 8 ? ['normal vision', 1] : P >= 3 ? ['tunnel vision: the edges fade', 0.35 + 0.65 * (P - 3) / 5] : P >= 0 ? ['grey-out: the sight is going', 0.35 * P / 3] : ['blackout: then loss of consciousness', 0]; }
let ang = 0;
function drawForce() {
  const { gz, R, tilt, suit } = ui.v, w = Math.sqrt((gz * G0) / R);
  ang += tr.dt * w;
  const rpm = (w * 60) / TAU, vtip = w * R;
  const Pe = pEye(gz, tilt, suit), [word, frac] = vision(Pe);
  const L = pens[0].begin().box(-R * 1.3, R * 1.3, -R * 1.05, R * 1.05, 8);
  L.circle({ x: 0, y: 0 }, R, { stroke: 'rgba(255,255,255,0.14)', width: 1.5, dash: [4, 6] });
  const tip = V.polar(R, ang);
  L.line([{ x: 0, y: 0 }, tip], '#9aa7b8', 6);
  L.dot({ x: 0, y: 0 }, '#9be7a6', 6);
  // the gondola, with the pilot's head toward the middle
  const dir = V.polar(1, ang), nrm = { x: -dir.y, y: dir.x }, gs = R * 0.07;
  const corner = (a, b) => ({ x: tip.x + dir.x * a + nrm.x * b, y: tip.y + dir.y * a + nrm.y * b });
  L.poly([corner(-gs, -gs), corner(gs * 1.2, -gs), corner(gs * 1.2, gs), corner(-gs, gs)], { fill: 'rgba(79,195,247,0.35)', stroke: '#4fc3f7', width: 2 });
  L.line([corner(gs * 0.8, 0), corner(-gs * 0.7, 0)], '#fff', 3); L.dot(corner(-gs * 0.7, 0), '#fff', 5);
  L.arrow(corner(gs * 1.2, 0), V.mul(dir, R * 0.13), '#ff9a3c', 3, `${gz.toFixed(1)} g`);
  L.note(`${rpm.toFixed(0)} turns a minute, ${vtip.toFixed(0)} m/s at the gondola`);
  // what the pilot sees
  const px = L.P({ x: R * 0.82, y: -R * 0.72 }), r0 = L.px(34), ctx = L.ctx;
  ctx.save(); ctx.beginPath(); ctx.arc(px.x, px.y, r0, 0, TAU); ctx.clip();
  const grad = ctx.createLinearGradient(px.x - r0, px.y - r0, px.x + r0, px.y + r0); grad.addColorStop(0, '#6aa8e8'); grad.addColorStop(0.6, '#bfe0ff'); grad.addColorStop(1, '#7fbf7f');
  ctx.fillStyle = grad; ctx.fillRect(px.x - r0, px.y - r0, 2 * r0, 2 * r0);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(px.x - r0 * 0.6, px.y - r0 * 0.1, r0 * 1.2, r0 * 0.12);
  const rg = ctx.createRadialGradient(px.x, px.y, r0 * frac * 0.55, px.x, px.y, Math.max(r0 * 0.05, r0 * frac));
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = rg; ctx.fillRect(px.x - r0, px.y - r0, 2 * r0, 2 * r0);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = L.px(1.5); ctx.beginPath(); ctx.arc(px.x, px.y, r0, 0, TAU); ctx.stroke();
  L.textS('what the pilot sees', px.x / L.dpr, px.y / L.dpr + 46, { size: 10.5, color: 'rgba(255,255,255,0.75)' });

  const Q = pens[1].begin();
  const ch = Q.chart({ x: 4, y: 2, w: Q.cw - 8, h: Q.ch - 6 }, { x0: 1, x1: 12, y0: -4, y1: 16, title: 'Blood pressure at the eyes (kPa) against the force (g)', xTicks: 11, yTicks: 5, xTitle: 'force on the pilot, head to feet (g)', fmtX: (v) => v.toFixed(0), fmtY: (v) => v.toFixed(0) });
  for (const [y, c, txt] of [[8, 'rgba(155,231,166,0.6)', 'normal vision'], [3, 'rgba(255,213,79,0.6)', 'tunnel vision'], [0, 'rgba(255,82,82,0.7)', 'blackout']]) { ch.hline(y, c, [5, 4]); ch.text(txt, 11.9, y, { align: 'right', dy: -9, size: 10, color: c }); }
  const curve = (tl, su) => { const o = []; for (let g = 1; g <= 12.001; g += 0.1) o.push({ x: g, y: pEye(g, tl, su) }); return o; };
  ch.line(curve(0, false), 'rgba(255,255,255,0.35)', 1.8, [5, 4]);
  ch.line(curve(tilt, suit), '#ff9a3c', 3.2);
  ch.dot(gz, Pe, '#fff', 6);
  const den = RHO * G0 * HEYE / 1000 * Math.cos(tilt * DEG) - 0.8, gOut = den > 0 ? (13.3 - 0.8 + (suit ? 8.6 : 0)) / den : Infinity;
  const gTun = ((den > 0) ? (13.3 - 0.8 + (suit ? 8.6 : 0) - 8) / den : Infinity);
  app.explain(`${nums([['force on the pilot', `${gz.toFixed(1)} g`], ['blood pressure at the eyes', `${Pe.toFixed(1)} kPa`, `(${(Pe * 7.5).toFixed(0)} mmHg)`], ['vision', word], ['vision fails at about', Number.isFinite(gOut) ? `${gOut.toFixed(1)} g` : 'no limit here']])}
    <p>In a tight turn, or in a centrifuge, a pilot feels several times the weight of the body, pressing from the head toward the feet. Blood is a liquid, and a column of it has a pressure that grows with its height and with the force: <b>pressure = density × g-force × height</b>. The heart is about 0.3 m below the eyes, so at 4 g the column from the heart to the eyes takes away about 12 kPa. The heart makes about 13 kPa, so very little is left at the eyes, and the brain starves. First the vision narrows to a tunnel, then it goes grey, then it goes dark, and the pilot may lose consciousness. The orange curve shows it; the dashed curve is an upright pilot with no help.</p>
    <p>Three things help. <b>Tilting the seat back</b> makes the column of blood shorter along the direction of the force: at 30° it is 87% as tall, which is why fighter seats are tilted. A <b>g-suit</b> squeezes the legs and belly, and <b>straining</b> the muscles keeps blood in the chest: together they raise the pressure by a few kPa, and a trained pilot can hold 9 g for several seconds. The arm length hardly matters for the pilot, only for how fast the arm must turn: a longer arm needs fewer turns a minute for the same force. The model is simple: a real blackout also depends on how long the force lasts, how fast it rises, and the pilot's training.</p>`);
}

// ---------- A spinning station ----------
let sang = 0;
function drawStation() {
  const { Rs, gs } = ui.v, w = Math.sqrt((gs * G0) / Rs), rpm = (w * 60) / TAU;
  sang += tr.dt * w * 8;                                            // drawn faster than the real turn, so that it can be seen
  const head = 1.8, gHead = (gs * (Rs - head)) / Rs;
  const L = pens[0].begin().box(-1.25, 1.25, -1.25, 1.25, 10);
  L.circle({ x: 0, y: 0 }, 1, { stroke: '#9aa7b8', width: 5 });
  for (let k = 0; k < 6; k++) { const a = sang + (k * TAU) / 6; L.line([{ x: 0.05 * Math.cos(a), y: 0.05 * Math.sin(a) }, V.polar(0.97, a)], 'rgba(255,255,255,0.08)', 1.2); }
  L.dot({ x: 0, y: 0 }, '#9be7a6', 4);
  const aP = sang + 0.7, out = V.polar(1, aP), hs = Math.max(0.1, head / Rs * 2.4);                       // the person, drawn larger than the true scale when the station is big
  L.line([V.mul(out, 1 - 0.015), V.mul(out, 1 - 0.015 - hs)], '#ffd54f', 5); L.dot(V.mul(out, 1 - 0.015 - hs), '#ffd54f', 6);
  L.arrow(V.mul(out, 1 - hs - 0.2), V.mul(out, 0.2 + 0.1), '#ff9a3c', 3, '');
  L.text('floor', V.mul(out, 1.1), { size: 10.5, color: '#9aa7b8' });
  L.text(`${rpm.toFixed(1)} turns a minute`, { x: 0, y: -0.2 }, { size: 14, color: '#fff' });
  L.text(`the person is drawn larger than true scale`, { x: 0, y: -1.15 }, { size: 10, color: 'rgba(255,255,255,0.5)' });
  L.note(`Weight at the floor ${gs.toFixed(2)} g, at the head ${gHead.toFixed(2)} g`);

  const Q = pens[1].begin(), h = Q.ch * 0.6 - 4;
  const ch = Q.chart({ x: 4, y: 2, w: Q.cw - 8, h }, { x0: Math.log10(5), x1: Math.log10(500), y0: 0, y1: 12, title: 'Turns a minute against the radius (m). Green: most people feel fine.', xTicks: 4, yTicks: 6, padB: 24, fmtX: (v) => `${Math.round(10 ** v)}`, fmtY: (v) => v.toFixed(0) });
  const rp = (g, r) => (Math.sqrt((g * G0) / r) * 60) / TAU, xs = []; for (let x = Math.log10(5); x <= Math.log10(500) + 1e-9; x += 0.02) xs.push(x);
  ch.band(Math.log10(5), Math.log10(500), 'rgba(255,82,82,0.05)');
  ch.hline(2, 'rgba(155,231,166,0.8)'); ch.hline(4, 'rgba(255,213,79,0.8)'); ch.hline(6, 'rgba(255,82,82,0.8)');
  ch.text('comfortable', Math.log10(480), 1, { align: 'right', size: 10, color: 'rgba(155,231,166,0.9)' }); ch.text('most adapt', Math.log10(480), 3, { align: 'right', size: 10, color: 'rgba(255,213,79,0.9)' }); ch.text('many feel sick', Math.log10(480), 5, { align: 'right', size: 10, color: 'rgba(255,162,74,0.9)' });
  ch.line(xs.map((x) => ({ x, y: rp(0.38, 10 ** x) })), 'rgba(255,255,255,0.3)', 1.6, [4, 4]); ch.line(xs.map((x) => ({ x, y: rp(1, 10 ** x) })), 'rgba(255,255,255,0.45)', 1.8, [4, 4]);
  ch.line(xs.map((x) => ({ x, y: rp(gs, 10 ** x) })), '#ff9a3c', 3);
  ch.dot(Math.log10(Rs), rpm, '#fff', 6);
  const c2 = Q.chart({ x: 4, y: h + 8, w: Q.cw - 8, h: Q.ch - h - 12 }, { x0: Math.log10(5), x1: Math.log10(500), y0: 0, y1: 100, title: 'Weight at the head, as a share of the weight at the feet (%)', xTicks: 4, yTicks: 4, xTitle: 'radius of the station (m)', fmtX: (v) => `${Math.round(10 ** v)}`, fmtY: (v) => v.toFixed(0) });
  c2.line(xs.map((x) => ({ x, y: 100 * (1 - head / 10 ** x) })), '#4fc3f7', 3); c2.dot(Math.log10(Rs), 100 * (1 - head / Rs), '#fff', 6);
  const zone = rpm <= 2 ? 'comfortable for almost everyone' : rpm <= 4 ? 'most people adapt in a few days' : rpm <= 6 ? 'many feel sick at first' : 'too fast for most people';
  app.explain(`${nums([['turning rate', `${rpm.toFixed(1)} turns a minute`], ['it is', zone], ['weight at the head', `${(100 * (1 - head / Rs)).toFixed(0)}%`, `of the weight at the feet (${head} m tall)`], ['speed of the floor', `${(w * Rs).toFixed(0)} m/s`]])}
    <p>A spinning station gives weight by turning: the floor is on the rim, and it pushes on you to bend your path into a circle. The weight is ω² R, so for 1 g at the floor a larger station can turn more slowly. A station 224 m in radius needs 2 turns a minute. One of 20 m needs 6.7 turns a minute. This matters for two reasons.</p>
    <p>First, the weight depends on the distance from the axis. Your head is closer to the axis than your feet, so it weighs less: by 1.8 m ÷ R. On a station of radius 20 m, the head feels 9% less than the feet, and a dropped ball falls in a curved path. Second, turning your head in a spinning station twists the inner ear's signal in the wrong way (the Coriolis effect on the fluid of the ear; see the balance page), and makes dizziness and sickness. Experiments in rotating rooms suggest that most people feel fine below about 2 turns a minute, can adapt up to about 4, and many get ill above 6. So a comfortable station is big. The dashed lines show 1 g and the weight on Mars, 0.38 g.</p>`);
}

function draw(now) {
  tr.step(now);
  if (ui.v.mode === 'gforce') drawForce(); else drawStation();
}
setup();
Spin.run(draw);
</script>
</body>
</html>
