<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resonance · Spin</title>
<meta name="description" content="Push a swing at the right rhythm and it grows. A driven, damped oscillator, its response curve, and how damping decides the peak." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="../shared/topbar.css" />
<link rel="stylesheet" href="../shared/spin.css" />
</head>
<body>
<script src="../shared/spin.js"></script>
<script>
const { C, V, fmt, nums, TAU, DEG } = Spin;

const app = Spin.app({
  slug: 'resonance',
  sub: 'A mass on a spring, pushed back and forth. What matters is how the rhythm of the push compares with the rhythm the spring likes.',
  views: [{ caption: 'The mass on its spring' }, { caption: 'Motion and response' }],
  go: 'Restart from rest', loop: false, speed: { min: 0.1, max: 2, value: 1, step: 0.05 },
});
const { ui, tr, pens } = app;

ui.slider('r', { label: 'Rhythm of the push, against the natural rhythm of the spring', min: 0.2, max: 2, step: 0.01, value: 0.8, fmt: (v) => v.toFixed(2) });
ui.chips([{ text: 'Slow 0.5', set: { r: 0.5 } }, { text: 'Just below 0.9', set: { r: 0.9 } }, { text: 'Resonance 1.0', set: { r: 1 } }, { text: 'Fast 1.5', set: { r: 1.5 } }]);
ui.slider('z', { label: 'Damping (friction)', min: 0.02, max: 0.5, step: 0.01, value: 0.1, fmt: (v) => v.toFixed(2), hint: 'Small damping: a tall, narrow peak. Large damping: a low, wide one.' });
ui.chips([{ text: 'Almost none', set: { z: 0.03 } }, { text: 'Light', set: { z: 0.1 } }, { text: 'Heavy', set: { z: 0.4 } }]);
app.credit('The spring has a natural rhythm of 1 swing a second. The push is a force that goes back and forth, and always starts with the mass at rest.');

const W0 = TAU;
ui.on(() => tr.restart());

function model() {
  const { r, z } = ui.v;
  const Om = r * W0;
  const A = 1 / Math.hypot(1 - r * r, 2 * z * r);
  const phi = Math.atan2(2 * z * r, 1 - r * r);
  const wd = W0 * Math.sqrt(1 - z * z);
  const C1 = -A * Math.cos(phi), C2 = (z * W0 * C1 - A * Om * Math.sin(phi)) / wd;
  const x = (t) => A * Math.cos(Om * t - phi) + Math.exp(-z * W0 * t) * (C1 * Math.cos(wd * t) + C2 * Math.sin(wd * t));
  const peak = 1 / (2 * z * Math.sqrt(1 - z * z));
  return { r, z, Om, A, phi, x, peak, force: (t) => Math.cos(Om * t) };
}

function draw(now) {
  tr.step(now);
  const m = model();
  const t = tr.t;
  // Left: the spring, the mass and the push.
  const p = pens[0].begin().box(-1.6, 1.6, -2.7, 3.0, 10);
  const scale = 1.9 / Math.max(1, m.peak); // the picture is scaled so that the largest swing at resonance fits
  const y = -m.x(t) * scale * -1; // up is positive
  const top = 2.2, mass = { x: 0, y: y - 0.2 };
  p.line([{ x: -0.9, y: top }, { x: 0.9, y: top }], 'rgba(255,255,255,0.7)', 5);
  const coil = [{ x: 0, y: top }];
  const n = 12, ytop = top - 0.15, ybot = mass.y + 0.42;
  for (let k = 0; k < n; k++) coil.push({ x: k % 2 ? 0.28 : -0.28, y: ytop + ((ybot - ytop) * (k + 0.5)) / n });
  coil.push({ x: 0, y: ybot }, { x: 0, y: mass.y + 0.3 });
  p.line(coil, '#aeb9c8', 2.5);
  p.rect(-0.45, mass.y - 0.3, 0.45, mass.y + 0.3, { fill: 'rgba(79,195,247,0.45)', stroke: C.ball, width: 2.5 });
  p.line([{ x: -1.3, y: 0 }, { x: -1.05, y: 0 }], 'rgba(255,255,255,0.4)', 1.5);
  p.text('rest', { x: -1.3, y: 0 }, { align: 'left', dy: -10, size: 10.5, color: 'rgba(255,255,255,0.5)' });
  const f = m.force(t);
  p.arrow({ x: 0.9, y: mass.y }, { x: 0, y: f * 1.1 }, C.ink, 4.5, 'push');
  p.note(`The mass swings ${(Math.abs(m.x(t)) / Math.max(1, m.peak) * 100).toFixed(0)}% of the largest swing`);

  // Right: the motion over the last 8 seconds, then the response curves.
  const q = pens[1].begin();
  const t1 = Math.max(8, t), t0 = t1 - 8;
  const ymax = Math.max(1.5, Math.min(m.peak * 1.1, 30));
  const top1 = q.chart({ x: 4, y: 2, w: q.cw - 8, h: q.ch * 0.46 }, { x0: t0, x1: t1, y0: -ymax, y1: ymax, title: 'Swing of the mass (blue) and the push (orange) against time (s)', xTicks: 8, yTicks: 4, fmtX: (v) => v.toFixed(0), padB: 20 });
  const mx = [], fx = [];
  for (let s = t0; s <= t + 1e-9; s += 0.02) { if (s < 0) continue; mx.push({ x: s, y: m.x(s) }); fx.push({ x: s, y: m.force(s) }); }
  top1.line(fx, 'rgba(255,162,74,0.7)', 1.8);
  top1.line(mx, C.ball, 2.5);
  const hh = q.ch * 0.5 - 6, yb = q.ch * 0.46 + 8, wc = (q.cw - 8) / 2 - 2;
  const resp = (r, z) => 1 / Math.hypot(1 - r * r, 2 * z * r);
  const ph = (r, z) => Math.atan2(2 * z * r, 1 - r * r) / DEG;
  const c1 = q.chart({ x: 4, y: yb, w: wc, h: hh }, { x0: 0, x1: 2, y0: 0, y1: ymax, title: 'Size of the swing against rhythm', xTicks: 4, yTicks: 4, padB: 20 });
  for (const zz of [0.05, 0.1, 0.2, 0.5]) { const pts = []; for (let r = 0.02; r <= 2; r += 0.01) pts.push({ x: r, y: resp(r, zz) }); c1.line(pts, 'rgba(255,255,255,0.18)', 1.2); }
  const pts = []; for (let r = 0.02; r <= 2; r += 0.01) pts.push({ x: r, y: resp(r, m.z) });
  c1.line(pts, C.ball, 2.8); c1.dot(m.r, m.A, C.ink, 6);
  const c2 = q.chart({ x: 8 + wc, y: yb, w: wc, h: hh }, { x0: 0, x1: 2, y0: 0, y1: 180, title: 'Lag of the swing behind the push (°)', xTicks: 4, yTicks: 3, padB: 20 });
  const pp = []; for (let r = 0.02; r <= 2; r += 0.01) pp.push({ x: r, y: ph(r, m.z) });
  c2.line(pp, C.friend, 2.8); c2.dot(m.r, m.phi / DEG, C.ink, 6);

  const Q = 1 / (2 * m.z);
  const where = m.r < 0.97 ? 'below the natural rhythm: the mass keeps up with the push' : m.r > 1.03 ? 'above the natural rhythm: the mass cannot keep up, and moves against the push' : 'at resonance: each push arrives as the mass is moving the right way';
  app.explain(`${nums([['swing once settled', `${m.A.toFixed(2)}`, 'times the slow-push swing'], ['largest possible (at resonance)', `${m.peak.toFixed(1)}×`], ['lag behind the push', `${(m.phi / DEG).toFixed(0)}°`], ['quality factor Q', Q.toFixed(1)]])}
    <p>The spring swings once a second if left alone. Here it is also pushed back and forth, ${where}.</p>
    <p>At first the mass has two motions at once: its own, which dies away, and the one forced by the push, which lasts. When the two have nearly the same rhythm, they take turns adding and cancelling, and the swing rises and falls (beats) before it settles. At resonance, the push always adds energy and the swing grows until friction takes away as much as the push adds. The less friction, the taller the peak: <b>Q</b> times the slow-push swing. A swing, a radio tuner, a wine glass sung to its note and an MRI scanner all depend on this.</p>`);
}
tr.restart();
Spin.run(draw);
</script>
</body>
</html>
