<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wagon wheels on film · Spin</title>
<meta name="description" content="Why a wheel on film seems to turn slowly, stand still or run backward. A film is a set of still pictures, and a fast rotation is seen as the smallest turn that fits the pictures. The same aliasing appears in any sampled signal." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="../shared/topbar.css" />
<link rel="stylesheet" href="../shared/spin.css" />
</head>
<body>
<script src="../shared/spin.js"></script>
<script>
const { C, V, fmt, nums, TAU, DEG } = Spin;

const app = Spin.app({
  slug: 'wagon',
  sub: 'A film is a series of still pictures. A fast wheel can look slow, still, or backward.',
  views: [{ caption: '' }, { caption: '' }],
  go: 'Restart', speed: { min: 0.05, max: 1, value: 1, step: 0.05 }, autostart: true,
});
const { ui, tr, pens } = app;
app.modes('mode', [['wheel', 'A wheel on film'], ['wave', 'Any signal, sampled']]);
const is = (m) => (v) => v.mode === m;

ui.slider('rps', { label: 'Real speed of the wheel', min: 0.1, max: 15, step: 0.05, value: 1.8, fmt: (v) => `${v} turns a second`, show: is('wheel') });
ui.slider('fps', { label: 'Pictures a second (frame rate)', min: 6, max: 60, step: 1, value: 24, show: is('wheel') });
ui.slider('n', { label: 'Number of spokes', min: 2, max: 24, step: 1, value: 12, show: is('wheel') });
ui.check('mark', 'Paint one spoke a different colour', false, { show: is('wheel') });
ui.chips([
  { text: 'Looks right (slow)', set: { n: 12, fps: 24, rps: 0.5 } },
  { text: 'Runs backward', set: { n: 12, fps: 24, rps: 1.8 } },
  { text: 'Stands still', set: { n: 12, fps: 24, rps: 2 } },
  { text: 'Slow, forward', set: { n: 12, fps: 24, rps: 2.2 } },
], { show: is('wheel') });
ui.slider('f', { label: 'Frequency of the signal', min: 0.2, max: 15, step: 0.1, value: 8.7, fmt: (v) => `${v} cycles a second`, show: is('wave') });
ui.slider('fs', { label: 'Samples a second', min: 2, max: 20, step: 1, value: 10, show: is('wave') });
ui.chips([{ text: 'Enough samples', set: { f: 2, fs: 10 } }, { text: 'Just over half', set: { f: 4.7, fs: 10 } }, { text: 'Too slow: a false wave', set: { f: 8.7, fs: 10 } }, { text: 'Exactly one cycle a sample', set: { f: 10, fs: 10 } }], { show: is('wave') });

ui.on(() => tr.restart());
const wrap = (x) => ((((x + 0.5) % 1) + 1) % 1) - 0.5;          // to the range -0.5 to 0.5

function wheel(pen, th, n, mark, blur) {
  const O = { x: 0, y: 0 };
  pen.circle(O, 1, { stroke: '#cfd8e3', width: 4 });
  pen.circle(O, 0.1, { fill: '#cfd8e3' });
  const steps = blur ? 8 : 1;
  for (let j = 0; j < steps; j++) {
    const a0 = th - (j * blur) / Math.max(1, steps - 1), al = blur ? 0.32 * (1 - j / steps) + 0.05 : 1;
    for (let i = 0; i < n; i++) {
      const a = a0 + (TAU * i) / n, tip = { x: Math.cos(a), y: Math.sin(a) };
      const special = mark && i === 0;
      pen.line([O, tip], special ? `rgba(255,154,60,${al})` : `rgba(207,216,227,${al})`, special ? 5 : 3);
    }
  }
  if (mark) { const a = th; pen.dot({ x: 0.82 * Math.cos(a), y: 0.82 * Math.sin(a) }, '#ff9a3c', 7); }
}

function drawWheel() {
  const { rps, fps, n, mark } = ui.v;
  const tm = tr.t, th = TAU * rps * tm;
  const k = Math.floor(tm * fps), thk = TAU * rps * (k / fps);
  const L = pens[0].begin().box(-1.25, 1.25, -1.25, 1.25, 14);
  wheel(L, th, n, mark, (TAU * rps) / 90);
  // the wheel as it was in the last picture
  for (let i = 0; i < n; i++) { const a = thk + (TAU * i) / n; L.line([{ x: 0, y: 0 }, { x: Math.cos(a), y: Math.sin(a) }], 'rgba(255,154,60,0.45)', 1.6, [4, 4]); }
  L.note('The real wheel (blurred, since it moves). Dashed: where it was in the last picture');

  const unit = mark ? 1 : 1 / n;
  const perFrame = rps / fps;                                    // turns between two pictures
  const seen = (wrap(perFrame / unit) * unit) * fps;              // turns a second, as it seems
  const R = pens[1].begin();
  const topH = R.ch * 0.5;
  const F = pens[1].box(-1.25, 1.25, -1.25, 1.25, 12, { x: 0, y: 0, w: R.cw, h: topH });
  wheel(F, thk, n, mark, 0);
  F.textS(`picture ${k}`, 10, 14, { size: 11, align: 'left', color: 'rgba(255,255,255,0.6)' });
  F.textS(`${fps} pictures a second`, R.cw - 10, 14, { size: 11, align: 'right', color: 'rgba(255,255,255,0.6)' });
  F.textS('What you see on the film', R.cw / 2, topH - 8, { size: 11.5, color: '#fff' });

  const xmax = 15, lim = fps * unit / 2;
  const ch = R.chart({ x: 4, y: topH + 2, w: R.cw - 8, h: R.ch - topH - 4 }, { x0: 0, x1: xmax, y0: -Math.max(lim * 1.3, 0.3), y1: Math.max(lim * 1.3, 0.3), title: 'Speed you see, against the real speed (turns a second)', xTicks: 5, yTicks: 4, xTitle: 'real speed (turns a second)', padB: 34, fmtY: (v) => v.toFixed(1) });
  ch.hline(0, 'rgba(255,255,255,0.35)', [1, 0]);
  const seg = []; let cur = [], prev = null;
  for (let x = 0; x <= xmax + 1e-9; x += 0.02) { const y = (wrap(x / fps / unit) * unit) * fps; if (prev !== null && Math.abs(y - prev) > lim) { seg.push(cur); cur = []; } cur.push({ x, y }); prev = y; }
  seg.push(cur);
  ch.line([{ x: 0, y: 0 }, { x: xmax, y: xmax }], 'rgba(255,255,255,0.3)', 1.4, [4, 4]);
  seg.forEach((s) => ch.line(s, '#4fc3f7', 2.6));
  ch.dot(rps, seen, '#ff9a3c', 6);

  const words = Math.abs(seen) < 0.02 ? 'it stands still' : seen > 0 ? `forward, slowly (${seen.toFixed(2)} turns a second)` : `backward (${Math.abs(seen).toFixed(2)} turns a second)`;
  const first = (fps * unit);
  app.explain(`${nums([['real speed', `${rps} turns a second`], ['spokes that pass a point, between pictures', `${((rps * n) / fps).toFixed(2)}`], ['on the film', Math.abs(rps - seen) < 0.02 ? 'it looks right' : words], ['speed that looks still', `${first.toFixed(1)} turns a second`]])}
    <p>A film is not smooth motion. It is a row of still pictures, ${fps} a second, and the wheel turns a little between two of them. Your eye joins the pictures by choosing the <b>smallest</b> movement that fits. With ${n} identical spokes, the wheel looks the same after each ${(360 / n).toFixed(1)}° turn, so you cannot tell which spoke went where. If a spoke moves just a little less than the gap to the next spoke, the smallest fit is that spoke moving <b>back</b> a little. The wheel seems to turn the wrong way. If it moves exactly one gap, nothing seems to change. It stands still.</p>
    <p>The blue graph shows it. The line is right only for slow wheels. Above the first corner, at ${(first / 2).toFixed(1)} turns a second, the apparent speed jumps to the other direction, and the sawtooth repeats, with a still wheel at ${first.toFixed(1)}, ${(first * 2).toFixed(1)} turns a second and so on. Paint one spoke a different colour: now you can tell the spokes apart, and the first still point moves to ${fps} turns a second. The same thing makes helicopter blades and car wheels look odd on video, and it happens under any flickering light.</p>`);
}

function drawWave() {
  const { f, fs } = ui.v;
  const T = 2, t = Math.min(tr.t * 0.5, T);
  const m = Math.round(f / fs), fa = f - m * fs;
  const L = pens[0].begin();
  const ch = L.chart({ x: 4, y: 2, w: L.cw - 8, h: L.ch - 6 }, { x0: 0, x1: T, y0: -1.3, y1: 1.3, title: 'The real signal (blue), the samples (white), and the wave they suggest (orange)', xTicks: 8, yTicks: 4, xTitle: 'time (s)', fmtY: (v) => v.toFixed(1) });
  const N = 900, sig = (g) => { const p = []; for (let i = 0; i <= N; i++) { const x = (i / N) * T; p.push({ x, y: Math.sin(TAU * g * x) }); } return p; };
  ch.line(sig(fa), 'rgba(255,154,60,0.9)', 2.6, [6, 4]);
  ch.line(sig(f), '#4fc3f7', 2);
  for (let i = 0; i / fs <= t + 1e-9; i++) { const x = i / fs; ch.vline(x, 'rgba(255,255,255,0.12)', [1, 0], 1); ch.dot(x, Math.sin(TAU * f * x), '#fff', 5); }
  ch.vline(t, 'rgba(255,255,255,0.35)');
  if (tr.running && tr.t * 0.5 > T + 1) tr.finish();
  const R = pens[1].begin();
  const xmax = 15, ymax = Math.max(fs / 2, 1) * 1.2;
  const c2 = R.chart({ x: 4, y: 2, w: R.cw - 8, h: R.ch - 6 }, { x0: 0, x1: xmax, y0: 0, y1: Math.max(ymax, 3), title: 'Frequency you would find from the samples, against the real frequency', xTicks: 5, yTicks: 5, xTitle: 'real frequency (cycles a second)', fmtY: (v) => v.toFixed(0) });
  c2.line([{ x: 0, y: 0 }, { x: xmax, y: xmax }], 'rgba(255,255,255,0.3)', 1.4, [4, 4]);
  const pts = []; for (let x = 0; x <= xmax + 1e-9; x += 0.05) pts.push({ x, y: Math.abs(x - Math.round(x / fs) * fs) });
  c2.line(pts, '#4fc3f7', 2.6);
  c2.vline(fs / 2, 'rgba(255,213,79,0.7)'); c2.text('half the sampling rate', fs / 2, Math.max(ymax, 3) * 0.92, { dx: 6, size: 10.5, color: '#ffd54f' });
  c2.dot(f, Math.abs(fa), '#ff9a3c', 6);
  const ok = f < fs / 2;
  app.explain(`${nums([['real frequency', `${f} cycles a second`], ['samples a second', String(fs)], ['frequency the samples suggest', `${Math.abs(fa).toFixed(1)}`, fa < 0 && Math.abs(fa) > 0.05 ? '(backward)' : ''], ['highest safe frequency', `${fs / 2}`, 'half the sampling rate']])}
    <p>Take a signal, and read its value ${fs} times a second. If it changes slowly, the samples trace it faithfully. But a fast signal can pass through <b>exactly the same sample points</b> as a much slower one. The orange dashed wave passes through every white dot, as the blue one does, and the samples cannot tell them apart. The slow wave is an <b>alias</b>: a false low frequency made by too few samples.</p>
    <p>${ok ? 'Here the signal is below half the sampling rate, so there is only one slow wave that fits, the true one.' : 'Here the signal is above half the sampling rate, so the samples suggest a different, slower wave.'} The rule, the <b>Nyquist limit</b>: to see a frequency correctly, you must sample at more than <b>twice</b> that frequency. This is why a CD samples at 44,100 times a second (to keep sounds up to 20,000 Hz), and why a film at 24 pictures a second cannot show a fast wheel. A wheel is the same problem: each spoke is a wave, and the camera takes the samples.</p>`);
}

function draw(now) {
  tr.step(now);
  if (ui.v.mode === 'wheel') drawWheel(); else drawWave();
}
tr.restart();
Spin.run(draw);
</script>
</body>
</html>
