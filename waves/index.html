<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waves on a string · Spin</title>
<meta name="description" content="Two waves that cross make a standing wave. A string has harmonics, and the sound of a plucked string depends on where it is plucked. A pulse reflects from a fixed end upside down, and from a free end upright." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="../shared/topbar.css" />
<link rel="stylesheet" href="../shared/spin.css" />
</head>
<body>
<script src="../shared/spin.js"></script>
<script>
const { C, V, fmt, nums, TAU } = Spin;

const app = Spin.app({
  slug: 'waves',
  sub: 'Waves pass through each other and add. At the ends of a string, they bounce back and add again.',
  views: [{ caption: '' }, { caption: '' }],
  go: 'Restart', loop: true, speed: { min: 0.1, max: 2, value: 1, step: 0.05 },
});
const { ui, tr, pens } = app;
app.modes('mode', [['cross', 'Two waves cross'], ['string', 'String and sound'], ['reflect', 'Pulse at an end']]);
const is = (m) => (v) => v.mode === m;

ui.slider('lam', { label: 'Wavelength', min: 1, max: 4, step: 0.1, value: 2, fmt: (v) => v.toFixed(1), show: is('cross') });
ui.slider('ratio', { label: 'Strength of the wave coming back', min: 0, max: 1.2, step: 0.05, value: 1, fmt: (v) => `${Math.round(v * 100)}% of the first`, show: is('cross') });
ui.chips([{ text: 'Equal: a standing wave', set: { ratio: 1 } }, { text: 'Half', set: { ratio: 0.5 } }, { text: 'None', set: { ratio: 0 } }], { show: is('cross') });
ui.seg('kind', [['one', 'One harmonic'], ['pluck', 'Plucked string']], { label: 'The string', show: is('string') });
ui.slider('n', { label: 'Harmonic', min: 1, max: 8, step: 1, value: 3, fmt: (v) => String(v), show: (v) => v.mode === 'string' && v.kind === 'one' });
ui.slider('pp', { label: 'Where it is plucked', min: 0.05, max: 0.5, step: 0.01, value: 0.2, fmt: (v) => `${Math.round(v * 100)}% along`, show: (v) => v.mode === 'string' && v.kind === 'pluck' });
ui.check('sound', 'Sound (the lowest note is A at 110 Hz)', false, { show: is('string') });
ui.hint('A free end is a ring on a smooth pole: it moves up and down without friction.', { show: is('reflect') });

function setup() {
  const m = ui.v.mode;
  tr.setGo(m === 'reflect' ? 'Send a pulse' : m === 'string' && ui.v.kind === 'pluck' ? 'Pluck' : 'Restart');
  tr.loopBox.parentElement.hidden = m === 'cross' || (m === 'string' && ui.v.kind === 'one');
  const caps = { cross: ['The two waves, and their sum', 'The string you see'], string: ['The string', 'Which harmonics, and the notes'], reflect: ['A fixed end: tied to a wall', 'A free end: a ring on a pole'] }[m];
  app.caption(0, caps[0]); app.caption(1, caps[1]);
  tr.reset();
  if (m === 'cross' || (m === 'string' && ui.v.kind === 'one')) tr.restart();
  if (m === 'reflect') tr.restart();
}
tr.onStart = () => { if (ui.v.mode === 'string' && ui.v.kind === 'pluck') pluck(); };
ui.on((id) => {
  if (id === 'sound') { if (ui.v.sound) tone.on(); else tone.off(); return; }
  setup();
});

// ---------- Two waves cross ----------

function drawCross(t) {
  const { lam, ratio } = ui.v;
  const k = TAU / lam, c = 1, w = c * k, X = 4;
  const A = 1, B = ratio;
  const fa = (x) => A * Math.sin(k * x - w * t), fb = (x) => B * Math.sin(k * x + w * t);
  const xs = []; for (let x = 0; x <= X + 1e-9; x += 0.02) xs.push(x);
  const L = pens[0].begin();
  const rows = [{ y: 5.6, label: 'wave going right', col: C.ball, f: fa }, { y: 2.8, label: 'wave coming back', col: C.friend, f: fb }, { y: 0, label: 'sum', col: C.ink, f: (x) => fa(x) + fb(x) }];
  L.box(-0.3, X + 0.3, -2.4, 7.8, 8);
  for (const r of rows) {
    L.line([{ x: 0, y: r.y }, { x: X, y: r.y }], 'rgba(255,255,255,0.15)', 1, [4, 5]);
    L.line(xs.map((x) => ({ x, y: r.y + r.f(x) })), r.col, r.label === 'sum' ? 3.5 : 2.5);
    L.text(r.label, { x: 0, y: r.y + 1.5 }, { align: 'left', size: 11, color: r.col });
  }
  L.arrow({ x: X - 0.3, y: 7.1 }, { x: 0.35, y: 0 }, C.ball, 3);
  L.arrow({ x: X - 0.1, y: 4.3 + 1.4 }, { x: -0.35, y: 0 }, C.friend, 3);
  const R = pens[1].begin().box(-0.3, X + 0.3, -2.6, 2.6, 14);
  R.line([{ x: 0, y: 0 }, { x: X, y: 0 }], 'rgba(255,255,255,0.15)', 1, [4, 5]);
  const env = A + B, lo = Math.abs(A - B);
  R.line(xs.map((x) => ({ x, y: env })), 'rgba(255,255,255,0.18)', 1.2, [5, 5]);
  R.line(xs.map((x) => ({ x, y: -env })), 'rgba(255,255,255,0.18)', 1.2, [5, 5]);
  R.line(xs.map((x) => ({ x, y: fa(x) + fb(x) })), C.ink, 4);
  if (ratio === 1) {
    for (let n = 0; n * lam / 2 <= X + 1e-9; n++) { R.dot({ x: (n * lam) / 2, y: 0 }, '#fff', 6); R.text('node', { x: (n * lam) / 2, y: 0 }, { dy: 16, size: 10.5, color: 'rgba(255,255,255,0.7)' }); }
    for (let n = 0; (n + 0.5) * lam / 2 <= X + 1e-9; n++) R.text('antinode', { x: ((n + 0.5) * lam) / 2, y: env }, { dy: -10, size: 10.5, color: 'rgba(255,162,74,0.9)' });
  }
  R.note(ratio === 1 ? 'Equal waves: the string stands still at the nodes' : ratio === 0 ? 'One wave: it simply travels' : 'Unequal waves: part travels, part stands');
  app.explain(`${nums([['wavelength', lam.toFixed(1)], ['nodes are', (lam / 2).toFixed(2), 'apart'], ['smallest swing', lo.toFixed(2), 'at every point']])}
    <p>When waves meet, their heights simply <b>add</b> at each point, and they pass on unchanged. A wave going right and an equal wave coming back add to give a pattern that does not travel: a <b>standing wave</b>. Some points, the nodes, never move, because the two waves always cancel there. Between them, the antinodes swing up and down by twice the height of one wave.</p>
    <p>With a weaker wave coming back, the nodes fill in, and part of the motion still travels. The nodes are half a wavelength apart. A guitar string is held at both ends, so only waves whose half-wavelengths fit the string exactly can stand on it. Those are its harmonics.</p>`);
}

// ---------- String and sound ----------

const F1 = 110;
let tone = Spin.tone(), actx = null;
function coeffs() {
  const out = [];
  for (let n = 1; n <= 12; n++) {
    if (ui.v.kind === 'one') out.push(n === ui.v.n ? 1 : 0);
    else { const p = ui.v.pp; out.push((2 * Math.sin(n * Math.PI * p)) / (n * n * Math.PI * Math.PI * p * (1 - p))); }
  }
  return out;
}
function pluck() {
  if (!ui.v.sound) return;
  actx = actx || new (window.AudioContext || window.BaseAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  const b = coeffs(), now = actx.currentTime;
  b.forEach((a, i) => {
    const n = i + 1, osc = actx.createOscillator(), g = actx.createGain();
    osc.frequency.value = F1 * n;
    g.gain.setValueAtTime(Math.min(0.25, Math.abs(a) * 0.35), now);
    g.gain.exponentialRampToValueAtTime(0.0005, now + 2.5 / (1 + 0.25 * n));
    osc.connect(g); g.connect(actx.destination); osc.start(now); osc.stop(now + 3);
  });
}
function drawString(t) {
  const b = coeffs(), one = ui.v.kind === 'one';
  const w1 = TAU * 1.5;
  const gam = (n) => (one ? 0 : 0.35 + 0.06 * n * n);
  const tt = one ? t : (tr.running || tr.endedAt ? t : 0);
  const u = (x) => b.reduce((s, a, i) => s + a * Math.sin((i + 1) * Math.PI * x) * Math.cos((i + 1) * w1 * tt) * Math.exp(-gam(i + 1) * tt), 0);
  const xs = []; for (let x = 0; x <= 1 + 1e-9; x += 0.005) xs.push(x);
  const amp = one ? 1 : Math.max(0.5, Math.max(...xs.map((x) => Math.abs(u(x) * 0)), 0) + 1);
  const peak = one ? 1 : Math.max(...b.map(Math.abs)) > 0 ? Math.max(...xs.map((x) => Math.abs(b.reduce((s, a, i) => s + a * Math.sin((i + 1) * Math.PI * x), 0)))) : 1;
  const p = pens[0].begin().box(-0.06, 1.06, -1.3, 1.3, 14);
  p.line([{ x: 0, y: 0 }, { x: 1, y: 0 }], 'rgba(255,255,255,0.15)', 1, [4, 5]);
  p.line([{ x: 0, y: -0.25 }, { x: 0, y: 0.25 }], 'rgba(255,255,255,0.7)', 5);
  p.line([{ x: 1, y: -0.25 }, { x: 1, y: 0.25 }], 'rgba(255,255,255,0.7)', 5);
  if (!one) p.line(xs.map((x) => ({ x, y: b.reduce((s, a, i) => s + a * Math.sin((i + 1) * Math.PI * x), 0) / peak })), 'rgba(255,255,255,0.12)', 1.2, [4, 5]);
  p.line(xs.map((x) => ({ x, y: u(x) / peak })), C.ink, 4);
  if (one) for (let m = 0; m <= ui.v.n; m++) p.dot({ x: m / ui.v.n, y: 0 }, '#fff', 5);
  if (!one) p.dot({ x: ui.v.pp, y: 1.0 / peak * 0 + 0 }, 'rgba(255,255,255,0)', 1);
  p.note(one ? `Harmonic ${ui.v.n}: ${ui.v.n + 1} nodes, ${ui.v.n} loops` : tr.running || tr.endedAt ? 'The string rings, and the high notes fade first' : 'Pulled aside at the pluck point. Press Pluck.');

  const q = pens[1].begin();
  const hh = q.ch * 0.58 - 4;
  const c1 = q.chart({ x: 4, y: 2, w: q.cw - 8, h: hh }, { x0: 0.4, x1: 12.6, y0: -0.2, y1: 1.05, title: 'How strong each harmonic is', xTicks: 12, yTicks: 4, fmtX: (v) => (Number.isInteger(v) ? v : ''), fmtY: (v) => v.toFixed(1), padB: 20 });
  const mx = Math.max(...b.map(Math.abs)) || 1;
  c1.bars(b.map((a, i) => ({ x: i + 1, y: Math.abs(a) / mx, color: one ? C.ball : `rgba(79,195,247,${0.4 + 0.6 * Math.abs(a) / mx})` })), 0.6);
  const c2 = q.chart({ x: 4, y: hh + 8, w: q.cw - 8, h: q.ch - hh - 12 }, { x0: 0.4, x1: 12.6, y0: 0, y1: F1 * 13, title: 'Pitch of each harmonic (Hz)', xTicks: 12, yTicks: 3, fmtX: (v) => (Number.isInteger(v) ? v : ''), padB: 20 });
  for (let n = 1; n <= 12; n++) { c2.dot(n, F1 * n, one && n === ui.v.n ? C.ink : 'rgba(255,255,255,0.5)', one && n === ui.v.n ? 6 : 4); }
  if (one && ui.v.sound) tone.set(F1 * ui.v.n, 0.07);
  else if (one || !ui.v.sound) tone.off();
  const note = one ? '' : ui.v.pp < 0.12 ? 'Plucked near the end: a bright, thin sound, many high harmonics.' : ui.v.pp > 0.4 ? 'Plucked in the middle: a round, hollow sound, mostly the lowest harmonic.' : 'Plucked part of the way along.';
  app.explain(`${nums([['lowest pitch', `${F1}`, 'Hz'], ['this harmonic', one ? `${F1 * ui.v.n}` : 'all together', one ? 'Hz' : '']])}
    <p>A string held at both ends can only carry waves that fit it: half a wavelength, a whole one, one and a half, and so on. The pitch of each is a <b>whole number times the lowest pitch</b>. These are the harmonics.</p>
    <p>${one ? 'Here the string is made to vibrate in one harmonic only. Its nodes stay still and its loops swing up and down. Turn on the sound to hear it.' : `A plucked string vibrates in <b>all</b> the harmonics at once. How much of each depends on where it is plucked: a harmonic with a node at the pluck point is not excited at all. ${note} Turn on the sound and pluck at different places.`}</p>`);
}

// ---------- A pulse at the end of a string ----------

function drawReflect(t) {
  const Lx = 10, c = 2.5, x0 = 2.5, wd = 0.7;
  const P = (xi) => Math.exp(-((xi / wd) ** 2));
  for (const [i, s, label] of [[0, -1, 'fixed'], [1, 1, 'free']]) {
    const f = (x) => P(x - x0 - c * t) + s * P(2 * Lx - x - x0 - c * t);
    const p = pens[i].begin().box(-0.4, Lx + 3.2, -1.7, 1.7, 14);
    p.line([{ x: 0, y: 0 }, { x: Lx, y: 0 }], 'rgba(255,255,255,0.12)', 1, [4, 5]);
    const phys = [], virt = [];
    for (let x = 0; x <= Lx + 1e-9; x += 0.04) phys.push({ x, y: f(x) });
    for (let x = Lx; x <= Lx + 3; x += 0.04) virt.push({ x, y: P(x - x0 - c * t) + s * P(2 * Lx - x - x0 - c * t) });
    p.line(virt, 'rgba(255,255,255,0.25)', 2, [4, 4]);
    p.line(phys, C.ink, 4);
    if (s === -1) { p.line([{ x: Lx, y: -1.4 }, { x: Lx, y: 1.4 }], 'rgba(255,255,255,0.8)', 6); p.dot({ x: Lx, y: 0 }, '#fff', 6); }
    else { p.line([{ x: Lx, y: -1.4 }, { x: Lx, y: 1.4 }], 'rgba(255,255,255,0.45)', 3); p.circle({ x: Lx, y: f(Lx) }, 0.12, { fill: 'rgba(255,162,74,0.5)', stroke: '#fff', width: 2 }); }
    p.text('dashed: the image pulse beyond the end', { x: Lx + 3.1, y: -1.45 }, { align: 'right', size: 10.5, color: 'rgba(255,255,255,0.5)' });
    p.note(label === 'fixed' ? 'Fixed end: the pulse comes back upside down' : 'Free end: the pulse comes back the right way up');
  }
  if (t > 7.2) tr.finish();
  app.explain(`<p>A pulse runs along the string and reaches the end. At a <b>fixed end</b> the string cannot move, so the end must always have zero height. The only way to do that is for a reflected pulse of opposite sign to arrive just as the incoming one does, and cancel it there. So the pulse comes back <b>upside down</b>. At a <b>free end</b> the string can move freely, and the end swings up to twice the pulse height. The pulse comes back the <b>same way up</b>.</p>
    <p>One way to see it: act as if the string went on beyond the end, and a mirror pulse (upside down for a fixed end, the same way up for a free end) came toward it from the other side. The two meet at the end, and for the fixed end they cancel there. This is why a guitar string, fixed at both ends, has nodes at its ends, and an open organ pipe, free at its ends, has antinodes there.</p>`);
}

function draw(now) {
  tr.step(now);
  const m = ui.v.mode;
  if (m === 'cross') drawCross(tr.t); else if (m === 'string') drawString(tr.t); else drawReflect(tr.running || tr.endedAt ? tr.t : 0);
}
setup();
Spin.run(draw);
</script>
</body>
</html>
